services:

  # ─── DATABASES ──────────────────────────────────────────

  db-users:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_USERS_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_USERS_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  db-posts:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_POSTS_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_POSTS_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_posts_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  # ─── SERVICES ───────────────────────────────────────────

  users-service:
    build:
      context: ./users-service
      args:
        APP_ENV: ${APP_ENV:-local}
    ports:
      - "8001:80"
    depends_on:
      db-users:
        condition: service_healthy
    env_file:
      - ./users-service/.env
    volumes:
      - ./users-service:/var/www
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/graphql"]
      timeout: 5s
      retries: 10
      interval: 5s

  posts-service:
    build:
      context: ./posts-service
      args:
        APP_ENV: ${APP_ENV:-local}
    ports:
      - "8002:80"
    depends_on:
      db-posts:
        condition: service_healthy
    env_file:
      - ./posts-service/.env
    volumes:
      - ./posts-service:/var/www
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/graphql"]
      timeout: 5s
      retries: 10
      interval: 5s

  # ─── GATEWAY ────────────────────────────────────────────

  gateway:
    build: ./gateway
    ports:
      - "4000:4000"
    depends_on:
      users-service:
        condition: service_healthy
      posts-service:
        condition: service_healthy
    env_file:
      - ./gateway/.env

# ─── VOLUMES ──────────────────────────────────────────────

volumes:
  mysql_users_data:
  mysql_posts_data: